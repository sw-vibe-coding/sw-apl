# sw-apl glyph expansions for Espanso (https://espanso.org).
# Copy to "$(espanso path config)/match/apl.yml" and run
# `espanso restart`. Prefix is the backtick; positions follow the
# classic APL typeball keyboard. See docs/glyph-entry.md.
matches:
  # number row
  - trigger: "`2"
    replace: "¯"
  - trigger: "`3"
    replace: "<"
  - trigger: "`4"
    replace: "≤"
  - trigger: "`5"
    replace: "="
  - trigger: "`6"
    replace: "≥"
  - trigger: "`7"
    replace: ">"
  - trigger: "`8"
    replace: "≠"
  - trigger: "`9"
    replace: "∨"
  - trigger: "`0"
    replace: "∧"
  - trigger: "`-"
    replace: "×"
  - trigger: "`="
    replace: "÷"
  # top row
  - trigger: "`q"
    replace: "?"
  - trigger: "`e"
    replace: "∊"
  - trigger: "`r"
    replace: "⍴"
  - trigger: "`t"
    replace: "~"
  - trigger: "`y"
    replace: "↑"
  - trigger: "`u"
    replace: "↓"
  - trigger: "`i"
    replace: "⍳"
  - trigger: "`o"
    replace: "○"
  - trigger: "`p"
    replace: "*"
  - trigger: "`["
    replace: "←"
  - trigger: "`]"
    replace: "→"
  # home row
  - trigger: "`s"
    replace: "⌈"
  - trigger: "`d"
    replace: "⌊"
  - trigger: "`f"
    replace: "_"
  - trigger: "`g"
    replace: "∇"
  - trigger: "`h"
    replace: "∆"
  - trigger: "`j"
    replace: "∘"
  - trigger: "`k"
    replace: "'"
  - trigger: "`l"
    replace: "⎕"
  # bottom row
  - trigger: "`b"
    replace: "⊥"
  - trigger: "`n"
    replace: "⊤"
  - trigger: "`m"
    replace: "|"
  - trigger: "`,"
    replace: "⍝"
  - trigger: "`."
    replace: "⍀"
  - trigger: "`/"
    replace: "⌿"
  # shifted
  - trigger: "`@"
    replace: "⍫"
  - trigger: "`#"
    replace: "⍒"
  - trigger: "`$"
    replace: "⍋"
  - trigger: "`%"
    replace: "⌽"
  - trigger: "`^"
    replace: "⍉"
  - trigger: "`&"
    replace: "⊖"
  - trigger: "`*"
    replace: "⍟"
  - trigger: "`("
    replace: "⍱"
  - trigger: "`)"
    replace: "⍲"
  - trigger: "`_"
    replace: "!"
  - trigger: "`+"
    replace: "⌹"
  - trigger: "`{"
    replace: "⍞"
  - trigger: "`H"
    replace: "⍙"
  - trigger: "`!"
    replace: "⌶"
