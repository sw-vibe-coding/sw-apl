[workspace]
members = [
    "crates/apl-console",
    "crates/apl-transcript",
    "crates/apl-saved",
    "crates/apl-workspace",
    "crates/apl-call",
    "crates/apl-quad",
    "crates/apl-clock",
    "crates/apl-space",
    "crates/apl-wsfile",
    "crates/apl-store",
    "crates/apl-modes",
    "crates/apl-shelves",
    "crates/apl-uses",
    "crates/apl-eval",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Michael A Wright"]
repository = "https://github.com/sw-vibe-coding/sw-apl"

[workspace.lints.clippy]
pedantic = "warn"
