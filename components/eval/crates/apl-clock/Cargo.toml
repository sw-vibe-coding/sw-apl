[package]
name = "apl-clock"
description = "sw-apl clock: the time, the date and the processor time, how a span and a moment read, and whether a session has a clock"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

# In a browser there is no operating system clock to read, so chrono
# reads the page's instead. Target-gated: nothing native changes, and
# cpu() already answers 0 where getrusage does not exist.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
