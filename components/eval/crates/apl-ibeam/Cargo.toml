[package]
name = "apl-ibeam"
description = "sw-apl I-beam system functions and the clock they read"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
apl-value = { path = "../../../value/crates/apl-value" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

# In a browser there is no operating system clock to read, so chrono
# reads the page's instead. Target-gated: nothing native changes, and
# cpu() already answers 0 where getrusage does not exist.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
