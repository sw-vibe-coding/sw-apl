# What only the (C) '80 mode has, or leaves out: APL80 on the TRS-80
# (docs/mode-c.md). The shared core reaches it only in (C); see
# docs/architecture.md, "Adding a mode".
[workspace]
members = [
    "crates/apl-c80-commands",
    "crates/apl-c80-chars",
    "crates/apl-c80-cuts",
    "crates/apl-c80-define",
    "crates/apl-c80-format",
    "crates/apl-c80-keys",
    "crates/apl-c80-machine",
    "crates/apl-c80-memory",
    "crates/apl-c80-port",
    "crates/apl-c80-scalar",
    "crates/apl-c80-screen",
    "crates/apl-c80-session",
    "crates/apl-c80-status",
    "crates/apl-c80-wsfile",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Michael A Wright"]
repository = "https://github.com/sw-vibe-coding/sw-apl"

[workspace.lints.clippy]
pedantic = "warn"
