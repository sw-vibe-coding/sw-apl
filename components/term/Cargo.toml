[workspace]
members = [
    "crates/apl-keyboard",
    "crates/apl-paper",
    "crates/apl-typing",
    "crates/aplterm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Michael A Wright"]
repository = "https://github.com/sw-vibe-coding/sw-apl"

[workspace.lints.clippy]
pedantic = "warn"
