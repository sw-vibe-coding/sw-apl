[package]
name = "aplterm"
description = "The 2741 terminal: a keyboard, a page, and a line to the service"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "aplterm"
path = "src/main.rs"

[dependencies]
apl-keyboard = { path = "../apl-keyboard" }
apl-paper = { path = "../apl-paper" }
apl-typing = { path = "../apl-typing" }
apl-wire = { path = "../../../web/crates/apl-wire" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
apl-wire = { path = "../../../web/crates/apl-wire" }
libc = "0.2"

[lints]
workspace = true

[build-dependencies]
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
