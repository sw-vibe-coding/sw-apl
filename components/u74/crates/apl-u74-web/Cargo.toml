[package]
name = "apl-u74-web"
description = "(U) '74 in a browser: the demo decks, each card's holes, and a deck run as a batch job"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
apl-session = { path = "../../../session/crates/apl-session" }
apl-u74-batch = { path = "../apl-u74-batch" }
apl-u74-card = { path = "../apl-u74-card" }
apl-u74-code = { path = "../apl-u74-code" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true

[dev-dependencies]
apl-u74-listing = { path = "../apl-u74-listing" }
