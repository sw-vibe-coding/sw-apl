# What only the (A) '68 mode has: the parts of APL\360 the IBM 5100
# family dropped (docs/mode-b.md). The shared core reaches them only in
# (A); see docs/architecture.md.
[workspace]
members = [
    "crates/apl-ibeam",
    "crates/apl-a68-commands",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Michael A Wright"]
repository = "https://github.com/sw-vibe-coding/sw-apl"

[workspace.lints.clippy]
pedantic = "warn"
