[workspace]
members = [
    "crates/apl-editor",
    "crates/apl-library",
    "crates/apl-copy",
    "crates/apl-inquiry",
    "crates/apl-extensions",
    "crates/apl-settings",
    "crates/apl-commands",
    "crates/apl-reply",
    "crates/apl-session",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Michael A Wright"]
repository = "https://github.com/sw-vibe-coding/sw-apl"

[workspace.lints.clippy]
pedantic = "warn"
