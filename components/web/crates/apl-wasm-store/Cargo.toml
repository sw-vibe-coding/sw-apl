[package]
name = "apl-wasm-store"
description = "sw-apl in a browser: the libraries a session keeps, from the page's storage, the bundle, and URLs"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
apl-session = { path = "../../../session/crates/apl-session" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope"] }

[lints]
workspace = true
