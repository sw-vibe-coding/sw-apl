[package]
name = "sw-apl-server"
description = "sw-apl service: the APL\\360 session a 2741 dials into"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "sw-apl-server"
path = "src/main.rs"

[dependencies]
apl-config = { path = "../../../cli/crates/apl-config" }
apl-attn = { path = "../../../value/crates/apl-attn" }
apl-wire = { path = "../apl-wire" }
apl-serve = { path = "../apl-serve" }
apl-session = { path = "../../../session/crates/apl-session" }
clap = { version = "4", features = ["derive"] }
tungstenite = "0.30"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[build-dependencies]
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
