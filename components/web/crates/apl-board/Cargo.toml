edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
apl-keyboard = { path = "../../../term/crates/apl-keyboard" }
apl-modes = { path = "../../../eval/crates/apl-modes" }
apl-c80-screen = { path = "../../../c80/crates/apl-c80-screen" }
