[package]
name = "apl-2741-prototype"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/keyboard", "crates/editor", "crates/transport"]

[[bin]]
name = "aplterm"
path = "src/bin/aplterm.rs"

[[bin]]
name = "aplterm-server"
path = "src/bin/aplterm-server.rs"

[dependencies]
aplterm-keyboard = { path = "crates/keyboard" }
aplterm-editor = { path = "crates/editor" }
aplterm-transport = { path = "crates/transport" }
serde_json = "1"

[dev-dependencies]
libc = "0.2"
