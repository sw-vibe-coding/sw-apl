<!DOCTYPE html>
<meta charset="utf-8">
<title>sw-apl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A clean-room APL interpreter, compiled to WebAssembly and running in the tab.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130e" media="(prefers-color-scheme: dark)">
<script>
  // An address from before this page existed named a mode here.
  if (new URLSearchParams(location.search).has("mode")) {
    location.replace(`demo.html${location.search}`);
  }
</script>
<style>
  :root { color-scheme: light dark; --paper: #fbf7ef; --ink: #2b2118; --rule: #d8cdb8; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #17130e; --ink: #e8dfd0; --rule: #3a3229; }
  }
  body { margin: 0 auto; max-width: 64rem; padding: 2rem 1.25rem;
    background: var(--paper); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif; }
  h1 { font-size: 1.75rem; font-weight: normal; margin: 0 0 1.5rem; }
  .machines { display: grid; gap: 1.25rem;
    grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }
  .machines a { display: block; position: relative; color: inherit; text-decoration: none;
    border: 1px solid var(--rule); border-radius: .5rem; overflow: hidden; }
  .machines a:hover, .machines a:focus-visible { border-color: var(--ink); }
  .machines a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .machines img { display: block; width: 100%; aspect-ratio: 5 / 4;
    object-fit: contain; background: #c3c7cc; }
  .machines img.dark { background: #2b3134; }
  .machines a::after { content: attr(data-tip); position: absolute; inset: 0 0 auto;
    aspect-ratio: 5 / 4; display: grid; place-content: center; text-align: center;
    padding: .5rem; box-sizing: border-box; font-size: 2rem; color: #fff;
    background: rgb(0 0 0 / .5); opacity: 0; pointer-events: none; }
  .machines a:hover::after, .machines a:focus-visible::after { opacity: 1; }
  .machines span { display: block; padding: .6rem; text-align: center; font-size: 1.25rem; }
</style>
<h1>sw-apl</h1>
<nav class="machines">
  <a id="apl-70" data-key="a" data-tip="APL\360" href="demo.html?mode=A">
    <img src="machines/70.webp" alt="A printing terminal with paper loaded"><span><u>A</u>'70</span></a>
  <a id="apl-75" data-key="b" data-tip="APLSV" href="demo.html?mode=B">
    <img src="machines/75.webp" alt="A desktop computer with a small screen above its keyboard"><span><u>B</u>'75</span></a>
  <a id="apl-80" data-key="c" data-tip="APL-80" href="coming-soon.html">
    <img src="machines/80.webp" alt="A home computer with a video display on its keyboard unit"><span><u>C</u>'80</span></a>
  <a id="apl-83" data-key="d" data-tip="IBM PC APL" href="coming-soon.html">
    <img class="dark" src="machines/83.webp" alt="A personal computer with two monitors and a keyboard"><span><u>D</u>'83</span></a>
</nav>
<script>
  // A letter, either case, is the same as choosing its tile.
  addEventListener("keydown", (event) => {
    if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
    const key = event.key.toLowerCase();
    if (key.length === 1) document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.click();
  });
</script>
