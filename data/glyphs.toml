# The sw-apl glyph tables: the single source of truth.
#
# build.rs in apl-value reads this file and emits Rust consts;
# scripts/gen-glyphs.sh regenerates docs/glyphs.txt from it. Nothing
# else may hold a copy of this data.
#
# APL\360 only. A glyph that a later APL introduced belongs in
# [[later]], not here.

# Primitive functions and operators: the glyphs the lexer accepts as
# a Prim token. `monadic` and `dyadic` are the traditional names;
# an empty string means the glyph has no meaning in that position.
