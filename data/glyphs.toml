# Syntax: punctuation and sentinels the lexer gives their own token.
[[syntax]]
glyph = "←"
name = "left arrow"
meaning = "assignment"

[[syntax]]
glyph = "→"
name = "right arrow"
meaning = "branch"

[[syntax]]
glyph = "∇"
name = "del"
meaning = "open or close a function definition"

[[syntax]]
glyph = "⍫"
name = "del-tilde"
meaning = "close a definition locked"

[[syntax]]
glyph = "⍝"
name = "lamp"
meaning = "comment to end of line"

[[syntax]]
glyph = "¯"
name = "high minus"
meaning = "negative sign in numeric literals"

[[syntax]]
glyph = "'"
name = "quote"
meaning = "character literal (doubled inside for a quote)"

[[syntax]]
glyph = ";"
name = "semicolon"
meaning = "index separator, local names, mixed output"

[[syntax]]
glyph = ":"
name = "colon"
meaning = "label terminator"

[[syntax]]
glyph = "("
name = "left paren"
meaning = "grouping"

[[syntax]]
glyph = ")"
name = "right paren"
meaning = "grouping; system command when first on the line"

[[syntax]]
glyph = "["
name = "left bracket"
meaning = "index or axis"

[[syntax]]
glyph = "]"
name = "right bracket"
meaning = "index or axis"

[[syntax]]
glyph = "⎕"
name = "quad"
meaning = "evaluated input and output"

[[syntax]]
glyph = "⍞"
name = "quote-quad"
meaning = "character input and output"

[[syntax]]
glyph = "∆"
name = "delta"
meaning = "letter usable in names"

[[syntax]]
glyph = "⍙"
name = "delta-underbar"
meaning = "letter usable in names"

# Characters often typed in place of an APL glyph, and the glyph
# meant. CHARACTER ERROR names the intended glyph.
[[lookalike]]
typed = "ρ"
meant = "⍴"

[[lookalike]]
typed = "ι"
meant = "⍳"

[[lookalike]]
typed = "∈"
meant = "∊"

[[lookalike]]
typed = "ε"
meant = "∊"

[[lookalike]]
typed = "Δ"
meant = "∆"

[[lookalike]]
typed = "−"
meant = "-"

[[lookalike]]
typed = "–"
meant = "-"

[[lookalike]]
typed = "—"
meant = "-"

[[lookalike]]
typed = "∣"
meant = "|"

[[lookalike]]
typed = "∗"
meant = "*"

[[lookalike]]
typed = "⋆"
meant = "*"

[[lookalike]]
typed = "∼"
meant = "~"

[[lookalike]]
typed = "¬"
meant = "~"

[[lookalike]]
typed = "·"
meant = "."

[[lookalike]]
typed = "‾"
meant = "¯"

[[lookalike]]
typed = "’"
meant = "'"

# Glyphs introduced by APLs after APL\360, with the name they go by
# there. sw-apl implements APL\360 only, so these are never valid;
# CHARACTER ERROR says what they are.
